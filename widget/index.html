<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AMI Parts Bridge</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-text">
        <h1>AMI Parts Bridge</h1>
        <p id="subtitle" class="muted">No active session</p>
      </div>
      <span id="supplierBadge" class="badge hidden"></span>
    </header>

    <main class="content">
      <section class="card session-card" id="sessionCard">
        <div class="session-top">
          <div>
            <div class="label">Job</div>
            <div id="jobLabel" class="value">—</div>
          </div>
          <div class="actions">
            <button type="button" id="copyVinBtn" class="btn secondary" disabled>Copy VIN</button>
            <button type="button" id="fillVinBtn" class="btn secondary" disabled>Fill VIN</button>
          </div>
        </div>
        <div class="vin-box">
          <div class="label">Vehicle / VIN</div>
          <div id="vehicleRow" class="vehicle-row">
            <span id="ymmLabel" class="value">—</span>
            <span class="vehicle-sep">·</span>
            <span id="vehicleLabel" class="mono">—</span>
          </div>
        </div>
      </section>

      <section class="card cart-card">
        <div class="cart-header">
          <div class="cart-title-row">
            <h2>Shop Cart</h2>
            <span id="cartCount" class="count-pill hidden">0</span>
          </div>
        </div>
        <div id="cartEmpty" class="empty">
          <span class="empty-title">Cart is empty</span>
          <span class="empty-hint"
            >Add parts on the supplier site and they’ll show up here.</span
          >
        </div>
        <div class="table-wrap">
          <table id="cartTable" class="hidden">
            <thead>
              <tr>
                <th>Part #</th>
                <th>Description</th>
                <th class="num">Qty</th>
                <th class="num">Cost</th>
                <th class="actions-col"></th>
              </tr>
            </thead>
            <tbody id="cartBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <p id="status" class="status" role="status"></p>

    <footer class="footer">
      <button type="button" id="clearBtn" class="btn secondary">Clear</button>
      <button type="button" id="transferBtn" class="btn primary" disabled>
        Transfer to Job Card
      </button>
    </footer>

    <script src="widget.js"></script>
  </body>
</html>
